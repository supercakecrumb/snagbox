{{define "content"}}
<h1>Projects</h1>

<div class="card">
  <form class="create-form" method="post" action="/projects">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <label>Slug<input type="text" name="slug" required></label>
    <label>Name<input type="text" name="name"></label>
    <label>Description<input type="text" name="description"></label>
    <button type="submit">Create project</button>
  </form>
</div>

{{if .Projects}}
<table>
  <thead><tr><th>ID</th><th>Slug</th><th>Name</th><th>Description</th><th></th></tr></thead>
  <tbody>
    {{range .Projects}}
    <tr>
      <td>{{.ID}}</td>
      <td><code>{{.Slug}}</code></td>
      <td>{{.Name}}</td>
      <td class="muted">{{.Description}}</td>
      <td>
        <form class="inline" method="post" action="/projects/{{.ID}}/delete" onsubmit="return confirm('Delete this project?')">
          <input type="hidden" name="csrf_token" value="{{$.CSRF}}">
          <button class="danger" type="submit">Delete</button>
        </form>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>
{{else}}
<p class="muted">No projects yet.</p>
{{end}}
{{end}}
