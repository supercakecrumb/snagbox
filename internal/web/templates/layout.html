{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snagbox admin</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    margin: 0;
    color: #1a1a1a;
    background: #f6f7f9;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
  nav {
    background: #1f2937;
    color: #f9fafb;
  }
  nav .container { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; padding: 0.75rem 1.5rem; }
  nav a { color: #d1d5db; text-decoration: none; font-size: 0.95rem; }
  nav a:hover { color: #fff; }
  nav a.active { color: #fff; font-weight: 600; }
  nav .brand { font-weight: 700; color: #fff; margin-right: 0.5rem; }
  nav form { margin-left: auto; }
  h1 { font-size: 1.5rem; margin: 0 0 1rem; }
  h2 { font-size: 1.15rem; margin: 1.5rem 0 0.75rem; }
  table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 6px; overflow: hidden; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
  th { background: #f3f4f6; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; color: #6b7280; }
  code { background: #eef0f3; padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.9em; }
  form.inline { display: inline; }
  input, select, textarea {
    font: inherit; padding: 0.4rem 0.55rem; border: 1px solid #cbd5e1; border-radius: 5px; background: #fff;
  }
  textarea { width: 100%; min-height: 4rem; }
  button {
    font: inherit; cursor: pointer; padding: 0.4rem 0.8rem; border: 1px solid transparent;
    border-radius: 5px; background: #2563eb; color: #fff;
  }
  button:hover { background: #1d4ed8; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #b91c1c; }
  button.link { background: none; color: #2563eb; border: none; padding: 0; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .create-form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-end; }
  .create-form label { display: flex; flex-direction: column; font-size: 0.8rem; color: #6b7280; gap: 0.2rem; }
  .stats { display: flex; flex-wrap: wrap; gap: 1rem; }
  .stat { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem 1.25rem; min-width: 8rem; }
  .stat .n { font-size: 1.8rem; font-weight: 700; }
  .stat .l { color: #6b7280; font-size: 0.85rem; }
  .token-box { background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .token-box code { background: #fff; word-break: break-all; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; }
  .thumbs img { max-height: 150px; border-radius: 4px; border: 1px solid #e5e7eb; }
  .body { white-space: pre-wrap; word-break: break-word; }
  .muted { color: #6b7280; }
  a { color: #2563eb; }
</style>
</head>
<body>
{{if not .Disabled}}{{if ne .Nav "login"}}
<nav>
  <div class="container">
    <span class="brand">snagbox</span>
    <a href="/"{{if eq .Nav "dashboard"}} class="active"{{end}}>Dashboard</a>
    <a href="/issues"{{if eq .Nav "issues"}} class="active"{{end}}>Issues</a>
    <a href="/projects"{{if eq .Nav "projects"}} class="active"{{end}}>Projects</a>
    <a href="/agents"{{if eq .Nav "agents"}} class="active"{{end}}>Agents</a>
    <a href="/tokens"{{if eq .Nav "tokens"}} class="active"{{end}}>Ingest tokens</a>
    <a href="/users"{{if eq .Nav "users"}} class="active"{{end}}>Users</a>
    <form method="post" action="/logout">
      <button class="link" type="submit">Log out</button>
    </form>
  </div>
</nav>
{{end}}{{end}}
<main class="container">
{{template "content" .}}
</main>
</body>
</html>{{end}}
