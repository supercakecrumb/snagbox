services:
  snagbox:
    build: .
    image: ghcr.io/supercakecrumb/snagbox:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      ADMIN_TG_IDS: "${ADMIN_TG_IDS}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-snagbox}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-snagbox}?sslmode=disable"
      S3_ENDPOINT: "minio:9000"
      S3_ACCESS_KEY: "${MINIO_ROOT_USER:-snagbox}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      S3_BUCKET: "${S3_BUCKET:-snagbox}"
      S3_USE_SSL: "false"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL}"
      SESSION_ENC_KEY: "${SESSION_ENC_KEY}"
      PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-snagbox}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-snagbox}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snagbox}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - snagbox-db:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-snagbox}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - snagbox-minio:/data

volumes:
  snagbox-db:
  snagbox-minio:
